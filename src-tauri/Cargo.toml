[package]
name = "cyberlab-studio"
version = "0.1.0"
description = "CyberLab Studio desktop app: the full site, offline, in its own window"
authors = ["CyberLab Studio contributors"]
license = "MIT"
repository = "https://github.com/Gaganpraveen/cyberlab-studio"
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

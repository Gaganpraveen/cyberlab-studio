name: Desktop apps

# Builds the Windows, macOS and Linux installers with Tauri.
# - Pull requests that change the desktop app: build only, to catch breakage.
#   The installers are kept with the run for two weeks so they can be tried.
# - A version tag (v0.2.0), or a manual run with "release" ticked: build and
#   attach the installers to a draft GitHub release for a maintainer to publish.
on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - '.github/workflows/desktop.yml'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Attach the installers to a draft release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    permissions:
      # Creating the draft release and uploading installers to it.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon and Intel)
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ''
            rust-targets: ''
          - name: Linux
            os: ubuntu-22.04
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release == true }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Build the installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # An empty tag name builds without touching releases.
          tagName: ${{ env.RELEASE == 'true' && 'v__VERSION__' || '' }}
          releaseName: CyberLab Studio v__VERSION__
          releaseBody: |
            Desktop installers for CyberLab Studio v__VERSION__. Every lesson and lab is built in, so the app works without an internet connection.

            - **Windows:** the `.exe` installer (or the `.msi` for managed installs)
            - **macOS, Apple silicon and Intel:** the `.dmg`
            - **Linux:** the `.AppImage`, `.deb` or `.rpm`

            These builds are not yet signed with an Apple or Microsoft certificate. On a Mac, right-click the app and choose **Open** the first time. On Windows, choose **More info**, then **Run anyway**.
          releaseDraft: true
          prerelease: false

      - name: Keep the installers with this run
        uses: actions/upload-artifact@v7
        with:
          name: cyberlab-studio-${{ runner.os }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.AppImage
          if-no-files-found: error
          retention-days: 14

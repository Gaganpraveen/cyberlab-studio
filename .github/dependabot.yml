# One grouped pull request per ecosystem per week, so dependency upkeep is a
# single review instead of a stream of notifications.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: America/Chicago
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ['*']
    ignore:
      # These need a coordinated migration (peer ranges of typescript-eslint,
      # eslint-plugin-jsx-a11y, and the Node 22 runtime), so they are upgraded
      # by hand rather than by an automated bump.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: America/Chicago
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ['*']
    labels: [dependencies]

- id: cloud-storage-exposure
  name: Cloud storage exposure
  aliases: [open bucket, leaky bucket, public bucket, misconfigured object storage]
  category: cloud
  summary: >-
    A bucket or other cloud storage is configured so that anonymous callers, or
    anyone with an account at the provider, can read its objects, usually
    through a policy, access control list or sharing link broader than
    intended. It needs no exploit, since the service does what its settings
    say, and it can last for years because nothing breaks for legitimate users.
  defenses:
    - Block public access at the organization or account level
    - Grants to named principals only
    - Separate buckets for public and private data
    - Continuous configuration monitoring
    - Object-level access logging
  topics: [CLD-03, CLD-01, CLD-02, CLD-08]
  labs: [cloud-iam-policy]
  attack: [T1530, T1619]
  cwe: [CWE-552, CWE-732]
  capec: [CAPEC-180]
  owasp: ['A02:2025', 'A01:2025']

- id: cloud-account-compromise
  name: Cloud account compromise
  aliases: [cloud account takeover, valid cloud accounts, compromised service account]
  category: cloud
  summary: >-
    An attacker signs in to a cloud tenant as a real user or service account,
    with credentials or tokens that were guessed, phished, bought or stolen.
    The management API is reachable from anywhere and judges each request by
    identity, so the attacker's actions look like normal use, and dormant or
    automated accounts without MFA are the ones most often abused.
  defenses:
    - Phishing-resistant MFA for people
    - Federation and short-lived credentials
    - Removal of dormant and unused accounts
    - Least-privilege permissions
    - Alerts on unusual sign-ins and API activity
  topics: [CLD-02, IAM-07, IAM-08, IAM-02]
  labs: []
  attack: [T1078.004]
  cwe: [CWE-308]
  capec: [CAPEC-560]
  owasp: ['A07:2025']

- id: cloud-access-key-exposure
  name: Cloud access key exposure
  aliases: [leaked access keys, hardcoded cloud credentials, secrets in code, secret sprawl]
  category: cloud
  summary: >-
    A long-lived cloud access key or other secret lands where others can read
    it, such as a repository's history, an infrastructure-as-code state file, a
    CI log or a container image layer, and is later found and used. The key
    works for anyone until it is revoked, and deleting it from the current file
    leaves every earlier copy intact.
  defenses:
    - Short-lived credentials instead of stored keys
    - Secrets managers and service-managed passwords
    - Secret scanning with push protection
    - Revoke and rotate first, then investigate
    - Encrypted, access-controlled IaC state
  topics: [CLD-08, IAM-07, CLD-04, CLD-07]
  labs: []
  attack: [T1552.001, T1078.004]
  cwe: [CWE-798, CWE-540, CWE-312, CWE-532]
  capec: [CAPEC-37]
  owasp: ['A07:2025']

- id: cloud-iam-privilege-escalation
  name: Cloud IAM privilege escalation
  aliases: [IAM privilege escalation, over-privileged role abuse, cloud permission escalation]
  category: cloud
  summary: >-
    A cloud identity with limited rights uses a permission that changes
    permissions, such as attaching policies, creating credentials for other
    identities or giving a more powerful role to a resource it launches, to
    make itself an administrator. It works because wildcard grants and
    permission-management actions are often handed out like ordinary ones.
  defenses:
    - Least-privilege policies without wildcards
    - Tight limits on permission-management actions
    - Permissions boundaries and organization guardrails
    - Alerts on policy, role and credential changes
    - Regular access reviews
  topics: [CLD-02, IAM-06]
  labs: [cloud-iam-policy]
  attack: [T1098.003, T1098.001, T1548.005]
  cwe: [CWE-269, CWE-266]
  capec: [CAPEC-233, CAPEC-122]
  owasp: ['A01:2025', 'A02:2025']

- id: cloud-metadata-credential-theft
  name: Cloud metadata credential theft
  aliases: [IMDS abuse, instance metadata credential theft, metadata service attack]
  category: cloud
  summary: >-
    An attacker obtains the temporary credentials that a cloud instance
    metadata service gives a virtual machine's role, usually by making a
    vulnerable application on the machine fetch them through server-side
    request forgery, then uses them with all of that role's permissions. The
    service trusts requests from the machine itself, so one application flaw
    becomes access to the cloud account.
  defenses:
    - Session-token metadata service such as IMDSv2
    - Least-privilege instance roles
    - Egress blocks on link-local addresses
    - Destination allowlists for URL fetching
    - Alerts on role credentials used off the instance
  topics: [CLD-02, APP-05, IAM-07]
  labs: [ssrf-url-filter]
  attack: [T1552.005, T1078.004]
  cwe: [CWE-918, CWE-522]
  capec: [CAPEC-664]
  owasp: ['A01:2025', 'API7:2023']

- id: container-escape
  name: Container escape
  aliases: [container breakout, escape to host]
  category: cloud
  summary: >-
    A process inside a container breaks out of its isolation and gains control
    of the host it shares with other containers. Every container runs on the
    host's kernel, so a kernel or runtime flaw, or a risky setting such as
    privileged mode, a mounted container-daemon socket or a host filesystem
    mount, turns control of one application into control of the machine.
  defenses:
    - Non-root containers with all capabilities dropped
    - No privileged mode, daemon socket or host mounts
    - Default seccomp and security-module profiles
    - Patched kernels and container runtimes
    - Separate hosts or VMs for untrusted workloads
  topics: [CLD-04, SYS-05, CLD-05]
  labs: []
  attack: [T1611]
  cwe: [CWE-250, CWE-653]
  capec: [CAPEC-480]
  owasp: ['A02:2025']

- id: kubernetes-rbac-abuse
  name: Kubernetes RBAC abuse
  aliases:
    [
      K8s RBAC misuse,
      cluster-admin abuse,
      service account token abuse,
      Kubernetes privilege escalation,
    ]
  category: cloud
  summary: >-
    An attacker who controls a pod or holds a stolen cluster credential uses
    overly broad role-based access control (RBAC) grants, such as cluster-admin
    bound to a default service account or rights to read secrets, create pods
    or bind roles, to take over the cluster. RBAC only adds permissions and some
    quietly imply others, so one broad binding and an automatically mounted
    token undo careful grants elsewhere.
  defenses:
    - Least-privilege roles scoped to a namespace
    - No cluster-admin or wildcard grants for workloads
    - One service account per workload
    - No token mounting for pods that never call the API
    - Regular review of role bindings
  topics: [CLD-05, IAM-06, IAM-07]
  labs: []
  attack: [T1098.006, T1552.007, T1610]
  cwe: [CWE-266, CWE-269]
  capec: [CAPEC-122]
  owasp: ['A01:2025']

- id: ci-cd-credential-theft
  name: CI/CD credential theft
  aliases: [pipeline secret theft, CI secret exfiltration, deploy credential theft]
  category: cloud
  summary: >-
    Attackers take the cloud and registry credentials that a build pipeline
    stores or is issued, through code that runs in a privileged job, a
    compromised CI service or third-party action, or a cloud trust policy that
    accepts tokens from any repository, and use them to reach production.
    Pipelines hold powerful deployment rights, often as long-lived secrets,
    while running code from many contributors, plugins and dependencies.
  defenses:
    - Short-lived OIDC credentials instead of stored secrets
    - Cloud trust policies pinned to one repository and branch
    - Least-privilege deployment roles
    - Protected release environments with approval
    - Fast rotation of any remaining CI secrets
  topics: [CLD-07, IAM-07, CLD-08]
  labs: []
  attack: [T1677, T1078.004]
  cwe: [CWE-522, CWE-863, CWE-829]
  capec: []
  owasp: ['A03:2025']

- id: cloud-resource-hijacking
  name: Cloud resource hijacking
  aliases: [cloud cryptojacking, cloud cryptomining, LLMjacking, cloud service hijacking]
  category: cloud
  summary: >-
    An attacker with access to a cloud account or cluster spends its compute
    and paid services on their own work, most often cryptocurrency mining but
    also bulk email or SMS and hosted AI models, and leaves the owner with the
    bill. Cloud capacity scales on demand and is billed to the account, so
    stolen credentials turn straight into money unless quotas and spending
    alerts intervene.
  defenses:
    - Least-privilege credentials and MFA
    - Service quotas and budget alerts
    - Alerts on unusual usage spikes
    - Resource limits for containers
    - Disabled unused regions and services
  topics: [MAL-01, CLD-02, CLD-05]
  labs: []
  attack: [T1496.001, T1496.004]
  cwe: []
  capec: []
  owasp: []

- id: cross-tenant-attack
  name: Cross-tenant attack
  aliases: [tenant isolation breach, cross-tenant escape, shared technology vulnerability]
  category: cloud
  summary: >-
    A customer of a shared cloud service, or an attacker posing as one,
    exploits a flaw in the provider's isolation between tenants, such as an
    escape from a shared host, a weakness in a managed service or a hardware
    side channel, to reach other customers' data. Because tenants share
    hardware, kernels and service code, one such bug on the provider's side can
    expose every customer, whatever their own settings.
  defenses:
    - Provider isolation testing and patching
    - Dedicated hosts or clusters for sensitive workloads
    - Customer-managed encryption keys
    - Tracking provider security bulletins
    - Key rotation after a provider disclosure
  topics: [CLD-01, SYS-05, SYS-08, CLD-05]
  labs: []
  attack: [T1611]
  cwe: [CWE-653, CWE-668]
  capec: [CAPEC-480]
  owasp: []

- id: evil-twin
  name: Evil twin access point
  aliases: [evil twin, rogue access point, fake hotspot, Wi-Fi impersonation]
  category: wireless-iot
  summary: >-
    An attacker runs an access point that copies a trusted network's name, and
    sometimes offers only weaker security, so nearby devices join it and send
    their traffic through the attacker. It works because devices choose
    networks by name, and open networks, shared passphrases and clients that
    skip certificate checks give them no way to tell the real access point from
    a copy.
  defenses:
    - Server certificate validation for Enterprise Wi-Fi
    - WPA3 with SAE-PK and Transition Disable
    - TLS or a VPN end to end
    - Wireless intrusion detection
  topics: [IOT-01]
  labs: []
  attack: [T1557.004, T1638]
  cwe: [CWE-300, CWE-295]
  capec: [CAPEC-615]
  owasp: []

- id: deauthentication-attack
  name: Deauthentication attack
  aliases: [deauth attack, disassociation attack, deauthentication flood]
  category: wireless-iot
  summary: >-
    Forged disconnect messages that claim to come from the access point knock
    devices off a Wi-Fi network, either to deny service or to make them
    reconnect so the attacker can record a fresh handshake or draw them to an
    evil twin. It works because, unless Protected Management Frames are in use,
    these control messages carry no authentication at all.
  defenses:
    - Protected Management Frames set to required
    - WPA3-only networks
    - Wireless intrusion detection
    - Wired fallback for critical devices
  topics: [IOT-01]
  labs: []
  attack: []
  cwe: [CWE-306]
  capec: [CAPEC-604]
  owasp: []

- id: wifi-handshake-cracking
  name: Wi-Fi handshake cracking
  aliases: [WPA2-PSK cracking, offline Wi-Fi password guessing, Wi-Fi password cracking]
  category: wireless-iot
  summary: >-
    An attacker records the handshake a device performs when it joins a
    WPA2-Personal network, then tests passphrase guesses against the recording
    offline until one fits. It works because everything in the handshake except
    the passphrase-derived key travels in the clear, so no access point is
    involved to limit the guesses and a guessable passphrase falls.
  defenses:
    - WPA3-Personal (SAE), which allows no offline guessing
    - Long random passphrases
    - Enterprise Wi-Fi with per-user credentials
    - Rotating the passphrase when people leave
  topics: [IOT-01, CRY-05]
  labs: []
  attack: [T1110.002, T1669]
  cwe: [CWE-521, CWE-1391]
  capec: [CAPEC-49, CAPEC-16]
  owasp: []

- id: wps-pin-brute-force
  name: WPS PIN brute force
  aliases: [WPS PIN attack, Wi-Fi Protected Setup attack]
  category: wireless-iot
  summary: >-
    An attacker in radio range guesses the eight-digit Wi-Fi Protected Setup PIN
    of an access point, and a recovered PIN yields the network password. It
    works because the access point's replies show whether the first half of the
    PIN is right on its own and the last digit is only a checksum, so at most
    11,000 guesses are needed, and many access points never lock out.
  defenses:
    - Disable WPS
    - Lockout after failed PIN attempts
    - Access point firmware updates
  topics: [IOT-01]
  labs: []
  attack: [T1110.001, T1669]
  cwe: [CWE-307, CWE-204]
  capec: [CAPEC-49]
  owasp: []

- id: key-reinstallation-attack
  name: Key reinstallation attack
  aliases: [KRACK]
  category: wireless-iot
  summary: >-
    An attacker positioned between a client and an access point replays a
    handshake message so that a vulnerable device reinstalls a key it is
    already using, which resets its nonce and lets the attacker decrypt, and
    sometimes forge, Wi-Fi frames. The password plays no part: the flaw lies in
    the handshake's state machine, which its security proofs did not model, so
    only software updates fix it.
  defenses:
    - Patch clients and access points
    - TLS or a VPN end to end
    - Isolate devices that cannot be patched
  topics: [IOT-01, CRY-06, CRY-02]
  labs: []
  attack: [T1557]
  cwe: [CWE-323]
  capec: []
  owasp: []

- id: bluetooth-pairing-attack
  name: Bluetooth pairing attack
  aliases: [Bluetooth MITM, KNOB attack, BIAS attack, legacy pairing eavesdropping]
  category: wireless-iot
  summary: >-
    An attacker in radio range exploits how Bluetooth devices agree on a key
    and later trust it: by sitting unnoticed in the middle of a pairing that
    nobody confirms, recovering the key from a recorded legacy pairing, pushing
    devices to negotiate a weak key, or impersonating a device that was paired
    before. It works because pairing authenticates only as strongly as its
    association model and protocol version allow, and devices often fall back
    to the weakest option for compatibility.
  defenses:
    - LE Secure Connections, ideally Secure Connections Only mode
    - Numeric Comparison or out-of-band pairing
    - Pairing rarely and in private
    - Firmware updates and removal of stale bonds
    - Authorization separate from pairing
  topics: [IOT-02, CRY-03]
  labs: []
  attack: [T1557]
  cwe: [CWE-322, CWE-326, CWE-757, CWE-290]
  capec: [CAPEC-668, CAPEC-667]
  owasp: []

- id: proximity-relay-attack
  name: Proximity relay attack
  aliases: [relay attack, keyless entry relay, relay theft, mafia fraud]
  category: wireless-iot
  summary: >-
    Two attacker radios forward messages between a genuine key, such as a car
    fob or a phone, and the lock it opens while the key is far away, so the
    lock acts as if its owner were standing beside it. Every relayed message is
    real and fresh, so cryptography notices nothing; the attack defeats any
    system that treats being within radio range as proof of presence.
  defenses:
    - Distance bounding with precise round-trip timing
    - A required user action, such as a button press
    - Keys that stop answering when not moving
    - Logging and alerts for every unlock
  topics: [IOT-02]
  labs: []
  attack: []
  cwe: []
  capec: []
  owasp: []

- id: malicious-mobile-app
  name: Malicious mobile app
  aliases: [mobile permission abuse, over-privileged app, rogue app, fake app]
  category: wireless-iot
  summary: >-
    An app, or a library bundled inside it, uses the permissions the user
    granted to collect contacts, location, audio or other protected data for
    purposes the user never agreed to. It works because a permission is a
    lasting capability shared by all code in the app, people approve prompts by
    reflex, and the operating system controls access to data, not what the app
    does with it afterward.
  defenses:
    - Least-privilege permissions requested in context
    - Narrower grants such as approximate or while-in-use location
    - Audits of bundled SDKs
    - Regular permission reviews and app store vetting
  topics: [IOT-03, HUM-05]
  labs: []
  attack: [T1636, T1430, T1429]
  cwe: [CWE-250, CWE-359]
  capec: []
  owasp: []

- id: default-device-credentials
  name: Default device credentials
  aliases: [default password attack, factory default credentials, universal default password]
  category: wireless-iot
  summary: >-
    An attacker logs in to a router, camera or controller with the password it
    shipped with, or with a secret built into every unit's firmware, and takes
    control of it; the Mirai botnet grew to hundreds of thousands of devices
    this way. It works because one published or extracted secret unlocks every
    unit of a model that nobody changed, and hard-coded secrets cannot be
    changed at all.
  defenses:
    - Unique per-device credentials, no universal defaults
    - No hard-coded secrets in firmware
    - Password change required at setup
    - Management interfaces kept off the internet
  topics: [IOT-05, IOT-08]
  labs: []
  attack: [T1078.001, T1694.001, T1694.002]
  cwe: [CWE-1392, CWE-1393, CWE-798]
  capec: [CAPEC-70]
  owasp: ['A07:2025']

- id: firmware-update-attack
  name: Firmware update attack
  aliases:
    [
      malicious firmware update,
      unsigned firmware update,
      firmware rollback attack,
      firmware downgrade attack,
    ]
  category: wireless-iot
  summary: >-
    An attacker gets a device to install firmware it should refuse: an image
    the vendor never signed, or an old, validly signed image with known flaws.
    Because firmware controls everything the device does and survives resets, a
    device that trusts its download channel instead of verifying a signed
    manifest, or never refuses older versions, can be taken over completely.
  defenses:
    - Signed manifests verified on the device before install
    - Monotonic sequence numbers for rollback protection
    - Secure boot that verifies the image again
    - Signing keys held in an HSM, with approvals
  topics: [IOT-06, SYS-07, IOT-05]
  labs: []
  attack: [T1693, T1542.001]
  cwe: [CWE-494, CWE-347, CWE-1328]
  capec: [CAPEC-186]
  owasp: ['A08:2025']

- id: unauthorized-control-command
  name: Unauthorized control command
  aliases: [unauthorized command message, rogue master, ICS process manipulation]
  category: wireless-iot
  summary: >-
    An attacker who reaches an industrial control network sends controllers
    commands or setpoint changes, or works the operators' own control screens,
    to run pumps, valves or breakers in ways the process was never meant to go.
    It works because many legacy control protocols act on any well-formed
    message without checking who sent it, so the network boundary is often the
    only protection.
  defenses:
    - Zones and conduits with an OT DMZ
    - Monitored remote access with MFA
    - Passive monitoring for unexpected commands
    - Independent safety instrumented systems
    - Change management and offline backups of controller logic
  topics: [IOT-07, NET-07]
  labs: []
  attack: [T1692.001, T0831, T0848]
  cwe: [CWE-306]
  capec: []
  owasp: []

- id: malicious-hardware-addition
  name: Malicious hardware addition
  aliases: [malicious USB device, hardware implant, rogue device]
  category: physical
  summary: >-
    Someone with brief physical access attaches a device to a computer or
    network, such as a USB device that identifies itself as a keyboard or a
    small hidden network device, to run commands or open a remote channel. It
    works because computers and networks trust newly attached hardware by
    default, and few organizations notice one extra device on a desk or in a
    wiring closet.
  defenses:
    - Port and device-class restrictions
    - Network access control on wired ports
    - Hardware inventory and regular inspection
    - Locked wiring closets and escorted visitors
  topics: [IOT-08, HUM-01]
  labs: []
  attack: [T1200, T1674, T1219.003]
  cwe: []
  capec: [CAPEC-440, CAPEC-401]
  owasp: []

- id: lost-or-stolen-device
  name: Lost or stolen device
  aliases: [device theft, laptop theft, stolen phone]
  category: physical
  summary: >-
    A lost or stolen laptop, phone or other device gives whoever holds it
    unlimited time with its storage and with any sessions or credentials left
    on it. Data is exposed when storage is unencrypted, when keys are usable
    without the owner, or when the accounts it was signed in to cannot be
    revoked remotely.
  defenses:
    - Disk or file encryption tied to the passcode
    - Automatic screen lock
    - Remote lock, wipe and session revocation
    - Short-lived tokens and minimal stored data
  topics: [IOT-04, IOT-08, IAM-04, SYS-07]
  labs: []
  attack: [T1461]
  cwe: [CWE-311, CWE-312, CWE-922]
  capec: [CAPEC-507]
  owasp: []

- id: evil-maid-attack
  name: Evil maid attack
  aliases: [unattended device tampering, boot tampering]
  category: physical
  summary: >-
    Someone left alone with an unattended device, such as a laptop in a hotel
    room, alters its boot software or hardware so that it later captures the
    owner's password or keeps access. It works when the device neither verifies
    nor measures its boot path, so the owner cannot tell that the machine they
    unlock is not the one they left.
  defenses:
    - Secure boot and measured boot with TPM-sealed keys
    - Pre-boot PIN for disk encryption
    - Tamper-evident seals and inspection
    - Keeping devices with you or locked away
  topics: [SYS-07, IOT-08]
  labs: []
  attack: [T1542.003]
  cwe: [CWE-1326]
  capec: []
  owasp: []

- id: physical-memory-attack
  name: Physical memory attack
  aliases: [cold boot attack, DMA attack, direct memory access attack]
  category: physical
  summary: >-
    Someone with hands on a running or sleeping computer reads its memory
    directly, through a port that gives peripherals direct memory access or by
    reading memory that keeps its contents briefly after power is cut. Disk
    encryption keys must stay in memory while a disk is unlocked, so they can
    be recovered without the password.
  defenses:
    - Kernel DMA protection with an IOMMU
    - Shutting down or hibernating instead of sleeping
    - Pre-boot authentication for disk encryption
    - Hardware memory encryption where available
  topics: [IOT-08, FOR-04, SYS-07, IOT-04]
  labs: []
  attack: [T1200]
  cwe: [CWE-316, CWE-1190]
  capec: [CAPEC-665]
  owasp: []

- id: hardware-tampering
  name: Hardware tampering
  aliases: [debug port access, fault injection, glitching, chip probing]
  category: physical
  summary: >-
    An attacker who can open a device works on its circuit board or chips, for
    example through debug interfaces left enabled in production or by inducing
    faults, to extract keys and firmware or skip security checks. It works
    because hardware that holds secrets is often designed as if nobody could
    reach it, so what one captured device yields depends on per-device keys,
    protected key storage and tamper controls.
  defenses:
    - Debug interfaces disabled or locked in production
    - Keys held in a secure element, TPM or HSM
    - Per-device keys so one capture yields little
    - Tamper evidence, resistance and response
  topics: [IOT-08, SYS-07]
  labs: []
  attack: []
  cwe: [CWE-1191, CWE-1247]
  capec: [CAPEC-624]
  owasp: []

- id: direct-prompt-injection
  name: Direct prompt injection
  aliases: [jailbreak, jailbreaking, LLM jailbreak, LLM prompt injection]
  category: ai
  summary: >-
    A user types instructions meant to override the application's own, steering
    the model to ignore its rules, reveal what it holds or misuse its tools; a
    jailbreak is the form aimed at the model's safety training. It works because
    the model receives the developer's instructions and the user's text as one
    stream of tokens, and only a learned tendency, not an enforced boundary,
    separates them.
  defenses:
    - Authorization enforced in tool code, not the prompt
    - Least-privilege tools with the user's own credentials
    - No secrets or access rules in system prompts
    - Guardrail classifiers as one layer, not a boundary
    - Adversarial testing after every model or prompt change
  topics: [AI-01, AI-04]
  labs: [prompt-injection]
  attack: [T1699]
  cwe: [CWE-1427]
  capec: []
  owasp: ['LLM01:2026']

- id: indirect-prompt-injection
  name: Indirect prompt injection
  aliases: [remote prompt injection, cross-domain prompt injection, XPIA]
  category: ai
  summary: >-
    An attacker plants instructions in content a model will read later, such as
    a web page, email, shared document or tool result, so the model acts on them
    while working for someone else. The user is the victim and may never see the
    planted text, and the model cannot reliably tell retrieved data from the
    instructions it should follow.
  defenses:
    - Least-privilege tools and data access
    - Human confirmation of consequential actions
    - Model output treated as untrusted and encoded
    - Untrusted content kept separate, labeled and stripped of hidden markup
    - Breaking the lethal trifecta of private data, untrusted content and outbound access
  topics: [AI-01, AI-02, AI-04]
  labs: []
  attack: [T1698]
  cwe: [CWE-1427]
  capec: []
  owasp: ['LLM01:2026']

- id: sensitive-information-disclosure
  name: Sensitive information disclosure
  aliases: [LLM data leakage, RAG oversharing, system prompt leakage, hidden context exposure]
  category: ai
  summary: >-
    An LLM application reveals data the person asking should not see, such as
    documents retrieved without that person's permissions, secrets placed in a
    system prompt, or answers cached from another user's session. It works
    because the model can repeat anything that reaches its context, and
    similarity search ranks passages by meaning, not by who may read them.
  defenses:
    - Permission filters inside the retrieval query that fail closed
    - The end user's identity on every data access
    - No secrets in prompts or model context
    - Minimized indexes, caches and logs
    - Access tests with synthetic identities
  topics: [AI-02, AI-01, AI-07]
  labs: [prompt-injection]
  attack: []
  cwe: [CWE-200, CWE-862, CWE-441]
  capec: []
  owasp: ['LLM02:2026', 'LLM08:2026', 'LLM09:2026']

- id: excessive-agency
  name: Excessive agency
  aliases: [over-privileged agent, agent tool misuse]
  category: ai
  summary: >-
    An AI agent holds more tools, permissions or autonomy than its task needs,
    so a manipulated or mistaken model can send data out, change records or run
    commands with that authority. The model holds no permissions of its own;
    its tools and their credentials do, so whoever steers the model, including
    through injected text, borrows them.
  defenses:
    - Only the narrow tools the task needs
    - The requesting user's scoped, short-lived credentials
    - A deny-by-default policy check in code on every tool call
    - Confirmation showing the exact action before consequential steps
    - Sandboxed code execution without secrets or open network access
  topics: [AI-04, AI-01, AI-08]
  labs: []
  attack: [T1700]
  cwe: [CWE-250, CWE-862, CWE-441]
  capec: []
  owasp: ['LLM03:2026']

- id: improper-output-handling
  name: Improper output handling
  aliases: [insecure output handling]
  category: ai
  summary: >-
    An application passes model output to a browser, database, shell or other
    interpreter without validating or encoding it, so text the model was
    steered into writing runs as script, a query or a command. Model output is
    untrusted input, because anyone who can influence the prompt, directly or
    through retrieved content, influences what the model writes.
  defenses:
    - Context-aware encoding before rendering
    - Schema validation of structured output
    - Parameterized queries and allowlisted actions for model-built requests
    - No automatic loading of external images or links
    - Least-privilege accounts for downstream systems
  topics: [AI-01, WEB-05, APP-01]
  labs: []
  attack: []
  cwe: [CWE-1426, CWE-116, CWE-79, CWE-89, CWE-78, CWE-94]
  capec: []
  owasp: ['LLM10:2026']

- id: data-and-model-poisoning
  name: Data and model poisoning
  aliases:
    [data poisoning, training data poisoning, model backdoor, trojaned model, backdoor attack]
  category: ai
  summary: >-
    An attacker corrupts what a model learns from, such as web-scale training
    data, a fine-tuning set or a retrieval corpus, or alters the model or its
    bundled template, so the model behaves wrongly or carries a hidden backdoor
    that fires on a secret trigger. Poisoned examples can look legitimate and a
    backdoored model behaves normally without its trigger, so ordinary testing
    rarely reveals either.
  defenses:
    - Snapshotted, hashed training data with restricted write access
    - Models pinned to verified revisions and digests
    - A provenance inventory with model and dataset documentation
    - Evaluation on held-out data and monitoring of outputs
    - Limited tools and permissions for unverified models
  topics: [AI-05, AI-08]
  labs: []
  attack: []
  cwe: [CWE-345]
  capec: []
  owasp: ['LLM05:2026', 'LLM04:2026', 'LLM09:2026']

- id: adversarial-examples
  name: Adversarial examples
  aliases: [evasion attack, model evasion, adversarial perturbation, adversarial input]
  category: ai
  summary: >-
    An attacker modifies an input, often by a change too small for a person to
    notice, so that a machine-learning model such as a malware, spam or phishing
    classifier makes the decision the attacker wants. It works because inputs
    can sit near a model's decision boundary, and in high dimensions many tiny
    feature changes add up to a large change in its score.
  defenses:
    - A stated threat model with robust-accuracy testing
    - Adversarial training
    - Labels instead of confidence scores, with per-identity query limits
    - Layered decisions that include non-ML checks
    - Adaptive evaluation by attackers who know the defense
  topics: [AI-06]
  labs: []
  attack: []
  cwe: [CWE-1039]
  capec: []
  owasp: []

- id: membership-inference
  name: Membership inference
  aliases: [MIA, membership inference attack]
  category: ai
  summary: >-
    An attacker queries a model to learn whether a particular person's record
    was in its training data, which can itself be a disclosure, as when the data
    comes from one clinic's patients. It works because models often fit their
    training examples better than unseen ones, for example by answering them
    with higher confidence.
  defenses:
    - Differential privacy in training
    - No confidence scores or log-probabilities in responses
    - Per-identity query limits and monitoring
    - Minimized, de-identified training data
  topics: [AI-07]
  labs: []
  attack: []
  cwe: [CWE-359]
  capec: []
  owasp: ['LLM02:2026']

- id: training-data-extraction
  name: Training-data extraction
  aliases: [training data leakage, memorization attack, data extraction attack]
  category: ai
  summary: >-
    An attacker recovers verbatim or near-verbatim training examples, such as
    names, phone numbers or private text, from a trained model by querying it
    or inspecting its weights. It works because models can memorize rare
    sequences, and data that shaped the weights can stay extractable after the
    source record is deleted.
  defenses:
    - Personal data scrubbed before training
    - Differential privacy for sensitive training sets
    - Canary and extraction tests before release
    - Deletion that covers checkpoints, adapters and embeddings
  topics: [AI-07]
  labs: []
  attack: []
  cwe: [CWE-200, CWE-359]
  capec: []
  owasp: ['LLM02:2026']

- id: model-extraction
  name: Model extraction
  aliases: [model stealing, model theft, distillation attack, model cloning]
  category: ai
  summary: >-
    An attacker queries a model many times and trains a substitute on its
    answers, or copies weights shipped inside an app, to get a working copy of
    a model they do not own. Besides taking the owner's investment, the copy
    lets the attacker prepare evasion and other attacks offline, out of the
    owner's sight.
  defenses:
    - Per-identity rate limits and quotas
    - Monitoring for systematic querying, including across many accounts
    - Labels or rounded scores instead of full probabilities
    - Protection of weights deployed to devices
  topics: [AI-07, AI-08]
  labs: []
  attack: []
  cwe: [CWE-799]
  capec: []
  owasp: ['LLM06:2026']

- id: unbounded-consumption
  name: Unbounded consumption
  aliases: [denial of wallet, LLM denial of service, model denial of service]
  category: ai
  summary: >-
    An attacker floods an LLM service with requests, very long inputs or tasks
    that trigger its most expensive processing, degrading it for others or
    running up the owner's pay-per-use bill, which is called denial of wallet.
    Each request can cost far more compute than it takes to send, so a service
    without per-identity quotas and caps on tokens, time and tool calls lets one
    caller consume without limit.
  defenses:
    - Per-identity rate limits and spending caps
    - Caps on input size, output tokens and execution time
    - Limits on agent iterations, retries and tool calls
    - Usage monitoring with cost alerts
  topics: [AI-08, APP-08]
  labs: []
  attack: [T1499.003]
  cwe: [CWE-770, CWE-400]
  capec: [CAPEC-130]
  owasp: ['LLM06:2026']

- id: insider-data-theft
  name: Insider data theft
  aliases: [insider data exfiltration, departing-employee data theft, intellectual property theft]
  category: insider
  summary: >-
    An employee, contractor or partner copies data they can reach, such as
    customer records, designs or source code, out of the organization for
    personal gain or a new employer, often around the time they resign. It
    works because the copying uses the person's own legitimate access and can
    look like everyday work, so controls built to stop outsiders do not see it.
  defenses:
    - Least privilege and need-to-know access
    - Data loss prevention for removable media, email and personal cloud storage
    - Prompt removal of access when people leave
    - Disclosed, proportionate activity monitoring with fair assessment
  topics: [HUM-06, IAM-08, FOR-07]
  labs: []
  attack: [T1213, T1039, T1052.001, T1567.002]
  cwe: []
  capec: []
  owasp: []

- id: insider-sabotage
  name: Insider sabotage
  aliases: [IT sabotage, logic bomb, disgruntled insider]
  category: insider
  summary: >-
    An insider, often an administrator with a grievance or a pending dismissal,
    uses legitimate access to damage the organization, for example by deleting
    or altering data, planting code that destroys data later, wiping backups or
    locking colleagues out. It works because the privileges needed to run
    systems are the same ones needed to destroy them, and insiders know where
    the backups and blind spots are.
  defenses:
    - Two-person approval for destructive or bulk changes
    - Immutable, offline backups with tested restores
    - Privileged access removed at or before dismissal
    - Review of code and configuration changes
    - Logs kept where administrators cannot erase them
  topics: [HUM-06, FND-05, IAM-08]
  labs: []
  attack: [T1485, T1565.001, T1490, T1531]
  cwe: [CWE-511]
  capec: [CAPEC-443]
  owasp: []

- id: insider-privilege-misuse
  name: Insider privilege misuse
  aliases: [privilege abuse, insider fraud, snooping]
  category: insider
  summary: >-
    An insider uses access they legitimately hold for a purpose it was never
    granted for, such as looking up a neighbor's records, approving their own
    payments or granting themselves extra rights. It works because access
    checks confirm who is asking rather than why, and standing access is often
    broader than each job needs.
  defenses:
    - Least privilege with object-level access rules
    - Separation of duties for approvals and payments
    - Audit logs of sensitive lookups, reviewed regularly
    - Periodic access recertification
  topics: [HUM-06, IAM-06, FND-05, FND-07]
  labs: []
  attack: [T1078, T1213, T1098]
  cwe: [CWE-269]
  capec: []
  owasp: []

- id: unintentional-insider-threat
  name: Unintentional insider threat
  aliases: [negligent insider, accidental insider, careless insider]
  category: insider
  summary: >-
    Someone with legitimate access and no intent to harm exposes data or
    systems by mistake or by working around a rule, for example by emailing a
    file to the wrong person, keeping customer records on a personal drive or
    sharing a folder too widely. It works because everyday work handles
    sensitive data, and the safe way to do a task is often slower or harder
    than the unsafe one.
  defenses:
    - Safe, easy tools for sharing and storing data
    - Recipient warnings and data loss prevention
    - Clear data-handling rules, with training on why they exist
    - Blameless reporting of mistakes
  topics: [HUM-06, HUM-07, GRC-03]
  labs: []
  attack: []
  cwe: []
  capec: []
  owasp: []

- id: insider-collusion
  name: Insider collusion
  aliases: [collusive insider, recruited insider, insider recruitment, bribed insider]
  category: insider
  summary: >-
    An outside group recruits, pays or pressures an employee or contractor to
    use their access on its behalf, for example by handing over credentials,
    approving sign-in prompts or installing remote-access software. It works
    because the insider's legitimate access and knowledge carry the outsider
    past controls built to stop strangers.
  defenses:
    - Least privilege and separation of duties
    - Alerts on new remote-access tools and unusual sign-ins
    - Confidential channels for reporting recruitment approaches
    - Vetting and monitoring of contractors and partners
  topics: [HUM-06, HUM-07]
  labs: []
  attack: [T1204, T1078, T1219]
  cwe: []
  capec: []
  owasp: []

- id: orphaned-access-abuse
  name: Orphaned access abuse
  aliases: [orphaned account, lingering access, ex-employee access, access creep]
  category: insider
  summary: >-
    A former employee or contractor, or someone who changed roles, keeps using
    access that was never fully removed, such as a long-lived session, a
    personal API token, a local password or a shared account. It works because
    access lives in many systems besides the identity provider, and removing it
    is a step nobody requests unless the lifecycle is automated and reviewed.
  defenses:
    - Deprovisioning driven by HR records, such as through SCIM
    - Sessions ended and tokens revoked at departure
    - Single sign-on only, without local passwords
    - Regular access reviews that remove orphaned accounts
    - Shared secrets rotated when someone leaves
  topics: [IAM-08, IAM-02, HUM-06, IAM-07]
  labs: []
  attack: [T1078]
  cwe: [CWE-613, CWE-269]
  capec: []
  owasp: []

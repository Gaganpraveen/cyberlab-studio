- id: bluetooth-attacks
  name: Bluetooth attacks
  aliases: [Bluejacking, Bluesnarfing, BlueBorne]
  category: wireless-iot
  summary: Weaknesses in Bluetooth pairing or stacks let nearby attackers connect, read data, or push content, exploiting short-range trust.
  defenses:
    - Keep devices patched
    - Disable Bluetooth when unused
    - Require confirmed pairing
    - Make devices non-discoverable
  topics: [IOT-02]

- id: mobile-malicious-app
  name: Malicious mobile app
  aliases: [Fake app, Sideloaded malware]
  category: wireless-iot
  summary: A hostile mobile app, sometimes sideloaded or disguised, abuses the permissions a user grants to steal data or spy on them.
  defenses:
    - Install from vetted stores
    - Review requested permissions
    - Mobile threat defense
    - Keep the OS updated
  topics: [IOT-03]
  attack: [T1476, T1660]

- id: insecure-mobile-storage
  name: Insecure mobile data storage
  aliases: [Local data exposure]
  category: wireless-iot
  summary: Sensitive data stored unprotected on a device can be read if the device is lost, shared, or compromised, because it was not encrypted or scoped.
  defenses:
    - Use platform secure storage
    - Encrypt sensitive data
    - Avoid storing secrets
    - Enforce device lock
  topics: [IOT-04]
  attack: [T1409]
  cwe: [CWE-312]

- id: sim-swapping
  name: SIM swapping
  aliases: [SIM swap, SIM hijacking]
  category: wireless-iot
  summary: An attacker convinces a carrier to move a victim's number to a new SIM, intercepting calls and SMS codes to take over accounts.
  defenses:
    - Carrier port-out PINs
    - App-based or hardware MFA
    - Avoid SMS for critical codes
    - Account change alerts
  topics: [IOT-05, IAM-03]
  attack: [T1451]

- id: firmware-tampering
  name: Firmware tampering
  aliases: [Firmware implant, Malicious firmware]
  category: wireless-iot
  summary: Modified device firmware gives attackers deep and persistent control that survives reboots and reinstalls, because firmware runs beneath the operating system.
  defenses:
    - Signed firmware and secure boot
    - Attestation
    - Protected update process
    - Supply-chain assurance
  topics: [IOT-06, SYS-07]
  attack: [T1542.001, T1495]

- id: iot-botnet-recruitment
  name: IoT device compromise
  aliases: [Mirai-style botnet, IoT recruitment]
  category: wireless-iot
  summary: Internet-exposed devices with weak or default credentials are mass-compromised into botnets, drawing on their numbers and poor maintenance.
  defenses:
    - Change default credentials
    - Patch and lifecycle management
    - Network segmentation
    - Disable remote admin
  topics: [IOT-05, MAL-05]
  attack: [T1078.001, T1583.005]
  cwe: [CWE-1392]

- id: ot-control-manipulation
  name: OT process manipulation
  aliases: [ICS manipulation, Control-logic tampering]
  category: wireless-iot
  summary: Attackers alter commands or parameters in operational technology so physical processes behave unsafely, threatening safety as well as availability.
  defenses:
    - Segment OT from IT
    - Strict access control
    - Integrity checks on commands
    - Safety instrumented systems
  topics: [IOT-07]
  attack: [T0831, T0836]

- id: malicious-usb
  name: Malicious USB device
  aliases: [BadUSB, USB HID injection, Rubber ducky]
  category: physical
  summary: A planted USB device delivers malware or emulates a keyboard to inject commands when plugged in, exploiting trust in physical ports.
  defenses:
    - Disable autorun
    - USB port control
    - Endpoint protection
    - Awareness training
  topics: [IOT-08, HUM-01]
  attack: [T1200, T1091]

- id: evil-maid-attack
  name: Evil maid attack
  aliases: [Unattended-device tampering]
  category: physical
  summary: An attacker with brief physical access to an unattended device tampers with it, for example implanting a boot-level compromise, because physical access bypasses many defenses.
  defenses:
    - Full-disk encryption
    - Secure and measured boot
    - Tamper-evident seals
    - Never leave devices unattended
  topics: [IOT-08, SYS-07]
  attack: [T1200, T1542.003]

- id: cold-boot-attack
  name: Cold boot attack
  aliases: [Memory remanence attack]
  category: physical
  summary: Data such as keys lingers briefly in RAM after power off, and an attacker with physical access can recover it before it fades.
  defenses:
    - Memory encryption
    - Clear keys on lock
    - Shorten key retention
    - Physical protection
  topics: [SYS-08, IOT-08]
  cwe: [CWE-316]

- id: hardware-side-channel
  name: Hardware side-channel attack
  aliases: [Power analysis, DPA, Electromagnetic analysis]
  category: physical
  summary: Measuring a chip's power, timing, or emissions while it computes can reveal secret keys, because physical behavior leaks information about the data.
  defenses:
    - Constant-time and masked implementations
    - Shielding and filtering
    - Noise and randomization
    - Certified hardware
  topics: [SYS-08, IOT-08]
  cwe: [CWE-1300, CWE-1255]

- id: fault-injection
  name: Fault injection
  aliases: [Glitching, Voltage glitching, Clock glitching]
  category: physical
  summary: Deliberate voltage, clock, or laser glitches make a chip skip or corrupt a step, bypassing checks such as secure boot or PIN verification.
  defenses:
    - Glitch detection sensors
    - Redundant checks
    - Tamper response
    - Certified secure elements
  topics: [IOT-08, SYS-07]
  cwe: [CWE-1247]

- id: rowhammer
  name: Rowhammer
  aliases: [Bit-flip attack]
  category: physical
  summary: Rapidly accessing memory rows flips bits in neighboring rows, letting an attacker corrupt data or escalate privileges without direct access to it.
  defenses:
    - Error-correcting memory
    - Target row refresh
    - Rate-limit memory accesses
    - Updated hardware
  topics: [SYS-01, IOT-08]
  cwe: [CWE-1256]

- id: debug-port-abuse
  name: Debug interface abuse
  aliases: [JTAG abuse, Test access abuse]
  category: physical
  summary: Exposed hardware debug or test interfaces let an attacker with physical access read memory and firmware or bypass protections.
  defenses:
    - Disable or lock debug in production
    - Authenticated debug
    - Fuse off test access
    - Physical protection
  topics: [IOT-08]
  cwe: [CWE-1234]

- id: secure-boot-bypass
  name: Secure boot bypass
  aliases: [Boot chain attack, Bootkit install]
  category: physical
  summary: Defeating the verified boot chain lets attacker code run before the operating system, undermining every protection that trusts a clean boot.
  defenses:
    - Immutable hardware root of trust
    - Signed boot stages
    - Rollback protection
    - Attestation
  topics: [SYS-07, IOT-06]
  attack: [T1542.003]
  cwe: [CWE-1326]

- id: prompt-injection
  name: Prompt injection
  aliases: [Direct prompt injection]
  category: ai
  summary: Crafted input overrides a model's intended instructions so it ignores its guardrails or follows the attacker, because the model cannot firmly separate instructions from data.
  defenses:
    - Separate instructions from untrusted data
    - Least-privilege tools
    - Output and action gating
    - Human approval for sensitive actions
  topics: [AI-01]
  attack: [T1699]
  cwe: [CWE-1427]
  owasp: ['LLM01:2025']

- id: indirect-prompt-injection
  name: Indirect prompt injection
  aliases: [Cross-domain prompt injection]
  category: ai
  summary: Hostile instructions hidden in content the model later retrieves, such as a web page or document, hijack its behavior when it processes them.
  defenses:
    - Treat retrieved content as untrusted
    - Content sanitization
    - Tool and data scoping
    - Human review
  topics: [AI-01, AI-02]
  attack: [T1698]
  cwe: [CWE-1427]
  owasp: ['LLM01:2025']

- id: llm-jailbreak
  name: LLM jailbreak
  aliases: [Guardrail bypass]
  category: ai
  summary: Carefully framed prompts coax a model into producing content its policies forbid, exploiting gaps between the policy and the model's behavior.
  defenses:
    - Robust alignment and filters
    - Input and output classifiers
    - Monitoring and red-teaming
    - Defense in depth
  topics: [AI-01, AI-03]
  attack: [T1699]
  cwe: [CWE-1427]
  owasp: ['LLM01:2025']

- id: training-data-poisoning
  name: Training data poisoning
  aliases: [Data poisoning, Model poisoning]
  category: ai
  summary: Attackers tamper with training or fine-tuning data so the model learns hidden flaws or backdoors, because the model reflects whatever it is trained on.
  defenses:
    - Vet and track data provenance
    - Dataset integrity checks
    - Anomaly detection in training
    - Limited and reviewed sources
  topics: [AI-05, AI-06]
  owasp: ['LLM04:2025']

- id: adversarial-examples
  name: Adversarial examples
  aliases: [Evasion attack, Input perturbation]
  category: ai
  summary: Small deliberate changes to an input make a model misclassify it while looking normal to people, exploiting the gap between model and human perception.
  defenses:
    - Adversarial training
    - Input preprocessing
    - Ensembles and detection
    - Confidence thresholds
  topics: [AI-06]
  cwe: [CWE-1039]

- id: model-extraction
  name: Model extraction
  aliases: [Model theft, Model stealing]
  category: ai
  summary: By querying a model many times an attacker reconstructs an equivalent model or its parameters, stealing intellectual property and enabling further attacks.
  defenses:
    - Rate limiting and quotas
    - Query monitoring
    - Output perturbation
    - Access controls
  topics: [AI-05, AI-08]

- id: membership-inference
  name: Membership inference
  aliases: [Model inversion, Training-data extraction]
  category: ai
  summary: An attacker infers whether specific records were in the training data or reconstructs sensitive examples from model outputs, leaking private information.
  defenses:
    - Differential privacy
    - Limit memorization
    - Minimize sensitive training data
    - Restrict output detail
  topics: [AI-07, AI-02]
  owasp: ['LLM02:2025']

- id: sensitive-information-disclosure-llm
  name: LLM sensitive information disclosure
  aliases: [Context leakage, RAG data leakage]
  category: ai
  summary: A model reveals secrets from its training data, context, or connected sources because it was given access to more than the user should see.
  defenses:
    - Scope retrieval to the user
    - Redact sensitive data
    - Output filtering
    - Least-privilege context
  topics: [AI-02, AI-07]
  cwe: [CWE-200]
  owasp: ['LLM02:2025', 'LLM08:2025']

- id: insecure-output-handling
  name: Insecure LLM output handling
  aliases: [Improper output handling]
  category: ai
  summary: Treating model output as trusted and passing it to other systems lets injected content trigger downstream attacks such as code execution or cross-site scripting.
  defenses:
    - Encode and validate model output
    - Treat output as untrusted
    - Sandboxed execution
    - Human review for actions
  topics: [AI-04, AI-01]
  cwe: [CWE-1426]
  owasp: ['LLM05:2025']

- id: excessive-agency
  name: Excessive agency
  aliases: [Over-privileged agent]
  category: ai
  summary: Giving an AI agent broad tools and autonomy lets a manipulated model take harmful actions, because its permissions exceed what the task needs.
  defenses:
    - Least-privilege tools
    - Human approval for high-impact actions
    - Scoped and auditable permissions
    - Action rate limits
  topics: [AI-04]
  attack: [T1700]
  owasp: ['LLM06:2025']

- id: system-prompt-leakage
  name: System prompt leakage
  aliases: [Prompt extraction]
  category: ai
  summary: An attacker extracts the hidden system prompt, revealing instructions, rules, or secrets that were wrongly assumed to stay private.
  defenses:
    - Keep secrets out of prompts
    - Enforce controls server-side
    - Output filtering
    - Assume prompts can leak
  topics: [AI-01, AI-02]
  owasp: ['LLM07:2025']

- id: model-supply-chain-attack
  name: Model supply chain attack
  aliases: [Poisoned model, Malicious model weights]
  category: ai
  summary: A pretrained model or component from an untrusted source carries backdoors or hostile code, compromising every system that adopts it.
  defenses:
    - Trusted model sources
    - Signing and provenance
    - Scanning and evaluation
    - Sandboxed loading
  topics: [AI-05]
  attack: [T1195]
  owasp: ['LLM03:2025']

- id: malicious-insider
  name: Malicious insider
  aliases: [Insider threat, Rogue employee]
  category: insider
  summary: Someone with legitimate access deliberately steals, leaks, or damages data, exploiting trust and knowledge that outsiders lack.
  defenses:
    - Least privilege and separation of duties
    - Monitoring and audit
    - Data loss prevention
    - Strong offboarding
  topics: [HUM-06, GRC-06]
  attack: [T1078, T1567]

- id: insider-data-exfiltration
  name: Insider data exfiltration
  aliases: [Insider data theft]
  category: insider
  summary: A trusted user copies sensitive data out through removable media, personal cloud, or email, abusing authorized access to information.
  defenses:
    - Data loss prevention
    - Egress monitoring
    - Device controls
    - Access limited to need
  topics: [HUM-06, FOR-01]
  attack: [T1052.001, T1048]

- id: privilege-abuse
  name: Privilege abuse
  aliases: [Access misuse]
  category: insider
  summary: An insider uses granted permissions for unauthorized purposes, such as snooping on records, because their access is broader than their task requires.
  defenses:
    - Least privilege
    - Log and review access
    - Need-to-know controls
    - Periodic recertification
  topics: [HUM-06, IAM-06]
  attack: [T1078]
  owasp: ['A01:2025']

- id: insider-sabotage
  name: Insider sabotage
  aliases: [Destructive insider]
  category: insider
  summary: A disgruntled insider destroys or corrupts systems or data to cause harm, using access and timing that bypass external defenses.
  defenses:
    - Separation of duties
    - Tested backups
    - Change control and review
    - Prompt revocation on departure
  topics: [HUM-06, MAL-07]
  attack: [T1485, T1565]

- id: logic-bomb
  name: Logic bomb
  aliases: [Time bomb]
  category: insider
  summary: Hidden code is planted to trigger damage on a condition or date, often by an insider, so the harm occurs long after the code was placed.
  defenses:
    - Code review
    - Change control
    - Separation of duties
    - Monitor for unauthorized changes
  topics: [HUM-06, MAL-01]
  cwe: [CWE-506]
  owasp: ['A08:2025']

- id: negligent-insider
  name: Negligent insider
  aliases: [Shadow IT, Accidental insider]
  category: insider
  summary: Well-meaning users create risk through mistakes or unsanctioned tools, exposing data without any malicious intent.
  defenses:
    - Clear policy and training
    - Sanctioned easy-to-use tools
    - Monitor for shadow IT
    - Data minimization
  topics: [HUM-06, GRC-06]

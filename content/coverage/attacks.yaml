# CyberLab Studio attack index.
# A-to-Z of attack types mapped to catalog topics and standard identifiers.
# See docs/CONTENT_GUIDE.md ("Attack index"). Conceptual only: no how-to steps.
# Identifiers verified against MITRE ATT&CK v19/v20, CWE 4.20, CAPEC 3.9,
# OWASP Top 10:2025, OWASP API Security Top 10 2023, OWASP LLM Top 10 2025.

- id: phishing
  name: Phishing
  aliases: [Phish, Email phishing]
  category: social-engineering
  summary: Fraudulent messages impersonate a trusted sender to trick people into revealing credentials or opening hostile content. It works because people judge messages by familiar branding and urgency rather than verifying the real sender.
  defenses:
    - Sender authentication with SPF DKIM and DMARC
    - User reporting and awareness training
    - Link and attachment filtering
    - Phishing-resistant MFA
  topics: [HUM-02, HUM-01, WEB-03]
  attack: [T1566]

- id: spear-phishing
  name: Spear phishing
  aliases: [Targeted phishing]
  category: social-engineering
  summary: Phishing tailored to a specific person or role using researched details, which raises credibility and slips past generic suspicion.
  defenses:
    - Verify unusual requests out of band
    - Least privilege for high-risk roles
    - Role-specific awareness training
    - Email authentication
  topics: [HUM-02, HUM-01]
  attack: [T1566.002]

- id: business-email-compromise
  name: Business email compromise
  aliases: [BEC, CEO fraud, Whaling]
  category: social-engineering
  summary: An attacker impersonates an executive or vendor in email to authorize fraudulent payments or data release, exploiting authority and routine business pressure.
  defenses:
    - Out-of-band payment verification
    - Dual approval for transfers
    - Email authentication
    - Vendor change controls
  topics: [HUM-01, GRC-06, HUM-06]
  attack: [T1566, T1657, T1534]

- id: vishing
  name: Voice phishing
  aliases: [Vishing]
  category: social-engineering
  summary: Phone calls impersonate support staff or officials to pressure a target into sharing secrets or granting access, exploiting live social pressure.
  defenses:
    - Callback verification
    - Help-desk identity checks
    - Awareness training
    - Limit sensitive actions by phone
  topics: [HUM-01, HUM-02]
  attack: [T1566.004, T1598.004]

- id: smishing
  name: SMS phishing
  aliases: [Smishing]
  category: social-engineering
  summary: Deceptive text messages lure targets to fake sites or to install hostile apps, exploiting the trust and brevity of mobile messaging.
  defenses:
    - Do not act on unsolicited links
    - Report and block numbers
    - Mobile threat defense
    - Verify requests through official channels
  topics: [HUM-02, HUM-01, IOT-03]
  attack: [T1660]

- id: pretexting
  name: Pretexting
  aliases: [Impersonation pretext]
  category: social-engineering
  summary: An attacker invents a believable scenario and role to extract information or access, exploiting helpfulness and assumed authority.
  defenses:
    - Verify identity before disclosure
    - Need-to-know policies
    - Awareness training
    - Clear escalation paths
  topics: [HUM-01, HUM-07]
  attack: [T1598, T1684]

- id: baiting
  name: Baiting
  aliases: [USB drop, Malicious media drop]
  category: social-engineering
  summary: Tempting physical media or offers are left for victims to use, exploiting curiosity to deliver hostile code or capture data.
  defenses:
    - Disable autorun
    - Device control policies
    - Awareness training
    - Endpoint protection
  topics: [HUM-01, IOT-08]
  attack: [T1091, T1200]

- id: deepfake-impersonation
  name: Deepfake impersonation
  aliases: [Synthetic media fraud, Voice cloning]
  category: social-engineering
  summary: Synthetic audio or video imitates a trusted person to authorize actions or spread false statements, exploiting our trust in seeing and hearing someone.
  defenses:
    - Out-of-band verification
    - Challenge phrases for sensitive requests
    - Provenance and watermarking
    - Awareness training
  topics: [HUM-01, AI-03, GRC-06]
  attack: [T1683.002, T1684.001]

- id: cross-site-scripting
  name: Cross-site scripting
  aliases: [XSS, Stored XSS, Reflected XSS]
  category: web
  summary: Untrusted input is rendered into a page without proper encoding, so the browser runs attacker-supplied script in the victim origin. It works because the browser cannot tell injected script from the site's own.
  defenses:
    - Context-aware output encoding
    - Content Security Policy
    - Input validation
    - Framework auto-escaping
  topics: [WEB-05, WEB-07]
  labs: [xss]
  cwe: [CWE-79, CWE-80, CWE-83]
  owasp: ['A05:2025']

- id: dom-based-xss
  name: DOM-based XSS
  aliases: [Client-side XSS]
  category: web
  summary: Client-side JavaScript writes untrusted data into dangerous sinks in the page, so script executes without the server ever seeing the payload.
  defenses:
    - Safe DOM APIs
    - Trusted Types
    - Avoid dangerous sinks
    - Content Security Policy
  topics: [WEB-05, WEB-07]
  labs: [xss]
  cwe: [CWE-79]
  owasp: ['A05:2025']

- id: csrf
  name: Cross-site request forgery
  aliases: [CSRF, XSRF]
  category: web
  summary: A logged-in user's browser is tricked into sending an unintended state-changing request, because the site trusts ambient cookies as proof of intent.
  defenses:
    - Anti-CSRF tokens
    - SameSite cookies
    - Re-authenticate sensitive actions
    - Check Origin and Referer
  topics: [WEB-06]
  cwe: [CWE-352]
  owasp: ['A01:2025']

- id: clickjacking
  name: Clickjacking
  aliases: [UI redressing]
  category: web
  summary: A victim is led to click a transparent or disguised overlay, so their action lands on a hidden sensitive control. It works because the visible page hides what truly receives the click.
  defenses:
    - Frame-ancestors in CSP
    - X-Frame-Options
    - Framebusting
    - Confirm sensitive actions
  topics: [WEB-08]
  cwe: [CWE-1021]
  owasp: ['A06:2025']

- id: open-redirect
  name: Open redirect
  aliases: [Unvalidated redirect]
  category: web
  summary: A site forwards users to a URL taken from unvalidated input, so an attacker can send victims to a hostile page under a trusted link.
  defenses:
    - Allowlist redirect targets
    - Use relative paths
    - Warn on external redirects
    - Avoid user-controlled destinations
  topics: [WEB-02, WEB-03]
  cwe: [CWE-601]
  owasp: ['A01:2025']

- id: idn-homograph-attack
  name: IDN homograph attack
  aliases: [Homograph attack, Homoglyph attack, IDN spoofing]
  category: web
  summary: Look-alike Unicode characters form a domain or name that appears identical to a trusted one, so victims trust a different owner. It works because distinct code points can share a glyph.
  defenses:
    - Punycode display for mixed scripts
    - Confusable-skeleton detection
    - Registrar script rules
    - Exact allowlists for known names
  topics: [WEB-01, WEB-02]
  labs: [homograph]

- id: typosquatting
  name: Typosquatting
  aliases: [URL hijacking, Typo domains]
  category: web
  summary: Attackers register domains that are common misspellings or variants of a real one to catch mistyped traffic and impersonate the brand.
  defenses:
    - Defensive domain registration
    - Brand monitoring
    - Registrable-domain checks
    - User awareness
  topics: [WEB-02, WEB-03]
  labs: [homograph]
  attack: [T1583.001]

- id: http-request-smuggling
  name: HTTP request smuggling
  aliases: [Request smuggling, Desync attack]
  category: web
  summary: Front-end and back-end servers disagree on where one request ends, so an attacker can sneak a hidden request to poison or hijack others. It works because of inconsistent parsing of request boundaries.
  defenses:
    - Consistent parsing across tiers
    - Reject ambiguous length headers
    - Use HTTP/2 end to end
    - Normalize at the edge
  topics: [NET-01, WEB-04]
  cwe: [CWE-444]
  owasp: ['A06:2025']

- id: cors-misconfiguration
  name: CORS misconfiguration
  aliases: [Permissive CORS]
  category: web
  summary: Overly broad cross-origin sharing rules let untrusted sites read responses that should be private, exposing data across origins.
  defenses:
    - Strict origin allowlists
    - Avoid wildcard with credentials
    - Validate Origin server-side
    - Minimal exposed headers
  topics: [WEB-04, WEB-07]
  cwe: [CWE-942]
  owasp: ['A02:2025']

- id: path-traversal
  name: Path traversal
  aliases: [Directory traversal, Dot-dot-slash]
  category: web
  summary: Unsanitized input in a file path lets an attacker escape the intended directory and read or write other files, because the path is resolved without restriction.
  defenses:
    - Canonicalize and validate paths
    - Allowlist filenames
    - Confine to a base directory
    - Least-privilege file access
  topics: [APP-04, APP-02]
  cwe: [CWE-22]
  owasp: ['A01:2025']

- id: broken-object-level-authorization
  name: Broken object-level authorization
  aliases: [IDOR, Insecure direct object reference, BOLA]
  category: web
  summary: An endpoint returns or changes an object from an identifier without checking that the caller may access that specific object, so changing the id reaches other users' data.
  defenses:
    - Enforce per-object authorization
    - Use scoped or unguessable references
    - Centralized access checks
    - Deny by default
  topics: [APP-06, IAM-06]
  cwe: [CWE-639, CWE-862]
  owasp: ['A01:2025', 'API1:2023']

- id: sql-injection
  name: SQL injection
  aliases: [SQLi]
  category: injection
  summary: Input is concatenated into a SQL statement, so it can change the query's structure and read or modify unintended data. It works because the database cannot separate code from data in a built string.
  defenses:
    - Parameterized queries
    - Least-privilege database accounts
    - Input validation
    - Safely used stored procedures
  topics: [APP-01, APP-02]
  labs: [sql-injection]
  attack: [T1190]
  cwe: [CWE-89]
  capec: [CAPEC-66]
  owasp: ['A05:2025']

- id: command-injection
  name: Command injection
  aliases: [OS command injection, Shell injection]
  category: injection
  summary: Untrusted input reaches a system shell, so it is interpreted as additional commands. It works because the input crosses from data into the command language.
  defenses:
    - Avoid invoking shells
    - Pass arguments as arrays
    - Strict allowlists
    - Least privilege
  topics: [APP-03, APP-02]
  cwe: [CWE-78, CWE-77]
  owasp: ['A05:2025']

- id: code-injection
  name: Code injection
  aliases: [Eval injection]
  category: injection
  summary: Untrusted input is evaluated as program code by an interpreter, letting an attacker run arbitrary logic. It works because dynamic evaluation blurs code and data.
  defenses:
    - Avoid dynamic evaluation
    - Sandboxing
    - Input validation
    - Safe serialization formats
  topics: [APP-03, APP-07]
  cwe: [CWE-94, CWE-95]
  owasp: ['A05:2025']

- id: ldap-injection
  name: LDAP injection
  aliases: [Directory injection]
  category: injection
  summary: Unsanitized input is placed into an LDAP query, changing its filter so an attacker can bypass checks or read directory data.
  defenses:
    - Encode LDAP metacharacters
    - Parameterized directory APIs
    - Input validation
    - Least privilege
  topics: [APP-02]
  cwe: [CWE-90]
  owasp: ['A05:2025']

- id: xpath-injection
  name: XPath injection
  aliases: [XPath query injection]
  category: injection
  summary: Untrusted input alters an XPath query over XML data, letting an attacker bypass logic or extract nodes they should not see.
  defenses:
    - Parameterized XPath
    - Input validation
    - Escape query metacharacters
    - Least privilege
  topics: [APP-02]
  cwe: [CWE-643]
  owasp: ['A05:2025']

- id: xxe
  name: XML external entity injection
  aliases: [XXE]
  category: injection
  summary: An XML parser that resolves external entities can be steered to read local files or reach internal systems, because the document can declare its own external references.
  defenses:
    - Disable external entities and DTDs
    - Use safe parser defaults
    - Allowlist schemas
    - Prefer simpler data formats
  topics: [APP-07, APP-02]
  cwe: [CWE-611, CWE-776]
  owasp: ['A02:2025']

- id: nosql-injection
  name: NoSQL injection
  aliases: [Document store injection]
  category: injection
  summary: Untrusted input changes the structure of a NoSQL query or operator, letting an attacker bypass authentication or read extra records.
  defenses:
    - Typed query builders
    - Reject operator objects from input
    - Input validation
    - Least privilege
  topics: [APP-01, APP-02]
  cwe: [CWE-74]
  owasp: ['A05:2025']

- id: header-injection
  name: HTTP header injection
  aliases: [CRLF injection, HTTP response splitting]
  category: injection
  summary: Unsanitized input containing line breaks is written into HTTP headers, letting an attacker inject headers or split the response. It works because CRLF marks header boundaries.
  defenses:
    - Strip CR and LF from header values
    - Framework header APIs
    - Input validation
    - Output encoding
  topics: [APP-02, WEB-04]
  cwe: [CWE-93, CWE-113]
  owasp: ['A05:2025']

- id: server-side-template-injection
  name: Server-side template injection
  aliases: [SSTI]
  category: injection
  summary: Untrusted input is evaluated by a server-side template engine, so attacker text becomes template code that can run on the server.
  defenses:
    - Do not build templates from user input
    - Logic-less templates
    - Sandboxed engines
    - Input validation
  topics: [APP-02, APP-07]
  cwe: [CWE-1336, CWE-94]
  owasp: ['A05:2025']

- id: deserialization-attack
  name: Insecure deserialization
  aliases: [Object injection, Deserialization of untrusted data]
  category: injection
  summary: Untrusted serialized data is reconstructed into objects, which can trigger dangerous code paths during or after parsing. It works because the format can carry type and behavior, not just values.
  defenses:
    - Avoid native deserialization of untrusted data
    - Use data-only formats
    - Integrity checks
    - Type allowlists
  topics: [APP-07]
  cwe: [CWE-502]
  owasp: ['A08:2025']

- id: log-injection
  name: Log injection
  aliases: [Log forging]
  category: injection
  summary: Unsanitized input written to logs can forge entries or inject content that harms log viewers and downstream parsers.
  defenses:
    - Neutralize line breaks in logs
    - Structured logging
    - Encode on display
    - Validate input
  topics: [OPS-01, APP-02]
  cwe: [CWE-117]
  owasp: ['A09:2025']

- id: arp-spoofing
  name: ARP spoofing
  aliases: [ARP cache poisoning, ARP poisoning]
  category: network
  summary: Forged ARP replies bind the attacker's MAC to another host's IP on a local network, so traffic is diverted through the attacker. It works because ARP has no authentication.
  defenses:
    - Dynamic ARP inspection
    - Static ARP for critical hosts
    - Network segmentation
    - Encrypt traffic end to end
  topics: [NET-03]
  attack: [T1557.002]

- id: dns-spoofing
  name: DNS spoofing
  aliases: [DNS cache poisoning, DNS hijacking]
  category: network
  summary: Forged or poisoned DNS answers send victims to attacker-controlled addresses, because classic DNS responses are not authenticated.
  defenses:
    - DNSSEC validation
    - Encrypted DNS
    - Randomize source port and query id
    - Monitor for anomalies
  topics: [NET-02]
  attack: [T1557, T1584.002]
  cwe: [CWE-350]

- id: man-in-the-middle
  name: Man-in-the-middle
  aliases: [MITM, Adversary-in-the-middle, AITM, On-path attack]
  category: network
  summary: An attacker positioned between two parties relays and can alter their traffic while appearing legitimate to both. It works when endpoints do not strongly authenticate each other.
  defenses:
    - Mutual TLS and certificate validation
    - Certificate pinning where appropriate
    - HSTS
    - Avoid untrusted networks
  topics: [NET-05, NET-01]
  attack: [T1557]
  cwe: [CWE-300]

- id: packet-sniffing
  name: Packet sniffing
  aliases: [Eavesdropping, Network sniffing]
  category: network
  summary: An attacker captures network traffic they can observe, reading any data sent without encryption. It works because shared or spanned links expose packets in transit.
  defenses:
    - Encrypt data in transit
    - Switched and segmented networks
    - Detect promiscuous interfaces
    - Avoid untrusted networks
  topics: [NET-08, NET-01]
  attack: [T1040]
  cwe: [CWE-319]
  owasp: ['A04:2025']

- id: dhcp-spoofing
  name: DHCP spoofing
  aliases: [Rogue DHCP]
  category: network
  summary: A rogue DHCP server hands clients attacker-chosen gateway or DNS settings, redirecting their traffic. It works because clients accept the first DHCP offer without authentication.
  defenses:
    - DHCP snooping
    - Port security
    - Network segmentation
    - Monitor for rogue servers
  topics: [NET-03]
  attack: [T1557.003]

- id: dns-tunneling
  name: DNS tunneling
  aliases: [DNS exfiltration]
  category: network
  summary: Data and commands are smuggled inside DNS queries and answers, abusing a protocol that firewalls usually allow out. It works because DNS is rarely inspected for payloads.
  defenses:
    - Inspect and baseline DNS
    - Block unknown resolvers
    - Rate-limit unusual query volumes
    - Egress filtering
  topics: [NET-02, MAL-04]
  attack: [T1071.004, T1572]

- id: bgp-hijacking
  name: BGP hijacking
  aliases: [Route hijacking, Prefix hijacking]
  category: network
  summary: A network announces IP prefixes it does not own, so traffic for those addresses is drawn to the wrong place. It works because routing trust between networks is largely by convention.
  defenses:
    - RPKI route origin validation
    - Prefix filtering
    - Peer monitoring
    - Anomaly detection
  topics: [NET-06]

- id: smb-relay
  name: Authentication relay
  aliases: [SMB relay, NTLM relay]
  category: network
  summary: An attacker forwards captured authentication handshakes to a third service to act as the victim, because the response is not bound to the intended server.
  defenses:
    - SMB and LDAP signing
    - Channel binding
    - Disable legacy NTLM
    - Segmentation
  topics: [NET-03, IAM-08]
  attack: [T1557.001, T1550.002]

- id: port-scanning
  name: Port scanning
  aliases: [Network reconnaissance, Service enumeration]
  category: network
  summary: Probing a range of addresses and ports maps which services are reachable, giving an attacker a target list. It works because reachable services answer probes.
  defenses:
    - Minimize exposed services
    - Firewalls and segmentation
    - Rate limiting and detection
    - Default-deny ingress
  topics: [NET-07, FND-04]
  attack: [T1046, T1595]

- id: computer-virus
  name: Computer virus
  aliases: [Virus]
  category: malware
  summary: Malicious code attaches to files or programs and runs when the host is opened, spreading as those files are shared. It works by riding on legitimate execution.
  defenses:
    - Endpoint protection
    - Application allowlisting
    - Patching
    - User awareness
  topics: [MAL-01]
  attack: [T1204.002]
  cwe: [CWE-509]
  owasp: ['A08:2025']

- id: computer-worm
  name: Computer worm
  aliases: [Worm]
  category: malware
  summary: Self-replicating malware spreads across a network without user action by exploiting services or weak credentials. It works by automating propagation.
  defenses:
    - Patch exposed services
    - Segmentation
    - Disable unused services
    - Strong credentials
  topics: [MAL-01, NET-07]
  attack: [T1210, T1091]
  cwe: [CWE-509]

- id: trojan
  name: Trojan horse
  aliases: [Trojan]
  category: malware
  summary: Malware disguised as a useful program runs hostile code once a user installs or opens it, exploiting trust in the apparent function.
  defenses:
    - Install from trusted sources
    - Code signing checks
    - Endpoint protection
    - Least privilege
  topics: [MAL-01, MAL-02]
  attack: [T1204.002, T1036]
  cwe: [CWE-506]
  owasp: ['A08:2025']

- id: ransomware
  name: Ransomware
  aliases: [Crypto-ransomware, Extortionware]
  category: malware
  summary: Malware encrypts or locks data and demands payment to restore access, and often also steals data to pressure victims. It works by denying access to what victims need.
  defenses:
    - Tested offline backups
    - Rapid patching
    - Segmentation and least privilege
    - Endpoint detection and response
  topics: [MAL-07, MAL-01]
  attack: [T1486, T1490]

- id: rootkit
  name: Rootkit
  aliases: [Kernel rootkit]
  category: malware
  summary: Malware that hides itself and other activity deep in the system, often by subverting the operating system, so defenders cannot easily see it.
  defenses:
    - Secure and measured boot
    - Kernel integrity controls
    - Reimage on compromise
    - Behavioral detection
  topics: [MAL-01, SYS-07]
  attack: [T1014, T1542]

- id: keylogger
  name: Keylogger
  aliases: [Keystroke logger]
  category: malware
  summary: Software or hardware records what a user types to capture passwords and messages, exploiting the input path before encryption.
  defenses:
    - Endpoint protection
    - Phishing-resistant MFA
    - Hardware inspection
    - Least privilege
  topics: [MAL-01, IOT-08]
  attack: [T1056.001]

- id: spyware
  name: Spyware
  aliases: [Stalkerware, Infostealer]
  category: malware
  summary: Malware covertly collects user activity and data and sends it to an operator, exploiting broad access once installed.
  defenses:
    - Endpoint protection
    - App permission review
    - Patch and update
    - Least privilege
  topics: [MAL-01, IOT-03]
  attack: [T1056, T1005]

- id: command-and-control
  name: Command and control
  aliases: [C2, CnC]
  category: malware
  summary: Compromised systems contact an operator channel to receive commands and send back data, often hiding inside normal-looking traffic.
  defenses:
    - Egress filtering
    - DNS and proxy inspection
    - Detect beaconing
    - Block known infrastructure
  topics: [MAL-04]
  attack: [T1071, T1573, T1095]

- id: botnet
  name: Botnet
  aliases: [Zombie network]
  category: malware
  summary: A network of compromised devices is controlled together to send spam, mine, or flood targets, drawing power from many hosts at once.
  defenses:
    - Patch and harden devices
    - Egress filtering
    - Detect and isolate infected hosts
    - Strong device credentials
  topics: [MAL-05]
  labs: [ddos]
  attack: [T1583.005, T1584.005]

- id: cryptojacking
  name: Cryptojacking
  aliases: [Malicious cryptomining]
  category: malware
  summary: Malware secretly uses a victim's computing resources to mine cryptocurrency, stealing compute and power rather than data.
  defenses:
    - Endpoint protection
    - Monitor resource use
    - Application allowlisting
    - Patch exposed services
  topics: [MAL-01, CLD-05]
  attack: [T1496.001, T1496.004]

- id: fileless-malware
  name: Fileless malware
  aliases: [Living off the land]
  category: malware
  summary: Malicious activity runs through built-in tools and memory rather than dropped files, so it leaves little on disk for scanners to find.
  defenses:
    - Script logging and monitoring
    - Constrained language modes
    - Behavioral detection
    - Least privilege
  topics: [MAL-02, MAL-03]
  attack: [T1059.001, T1027.011]

- id: credential-brute-force
  name: Credential brute force
  aliases: [Online brute force, Password guessing]
  category: identity
  summary: An attacker tries many passwords against a login until one works, exploiting weak or common passwords and missing rate limits.
  defenses:
    - Rate limiting and lockout
    - Strong password policy
    - Phishing-resistant MFA
    - Breached-password screening
  topics: [IAM-02, HUM-04]
  labs: [password-cracking]
  attack: [T1110.001]
  cwe: [CWE-307, CWE-521]
  owasp: ['A07:2025']

- id: offline-password-cracking
  name: Offline password cracking
  aliases: [Hash cracking, Password cracking]
  category: identity
  summary: Given stolen password hashes, an attacker computes guesses offline until hashes match, exploiting fast or unsalted hashing.
  defenses:
    - Slow salted key derivation
    - Strong unique passwords
    - Protect hash stores
    - Monitor for theft
  topics: [CRY-05, IAM-02, CRY-01]
  labs: [password-cracking]
  attack: [T1110.002]
  cwe: [CWE-916, CWE-759, CWE-760]
  owasp: ['A04:2025']

- id: credential-stuffing
  name: Credential stuffing
  aliases: [Breach replay]
  category: identity
  summary: Attackers replay username and password pairs leaked from other breaches, exploiting password reuse across sites.
  defenses:
    - Phishing-resistant MFA
    - Breached-credential detection
    - Rate limiting
    - Encourage unique passwords
  topics: [IAM-02, HUM-04]
  attack: [T1110.004]
  cwe: [CWE-307]
  owasp: ['A07:2025']

- id: password-spraying
  name: Password spraying
  aliases: [Low-and-slow guessing]
  category: identity
  summary: A few common passwords are tried across many accounts to avoid lockouts, exploiting the chance that someone uses a weak password.
  defenses:
